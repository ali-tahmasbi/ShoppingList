{% extends 'base.html' %}

{% block content %}
    <form method="post" novalidate>
        {% csrf_token %}
        {{ form.username.label }}
        {{ form.username }}
        {{ form.username.errors }}
        <hr>
        {{ form.password.label }}
        {{ form.password }}
        {{ form.password.errors }}
        <hr>
        <button type="submit">
            login
        </button>
        <a href="{% url 'register' %}">signup</a>
    </form>
{% endblock %}
