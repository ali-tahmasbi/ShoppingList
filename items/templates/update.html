{% extends 'base.html' %}

{% block content %}
    <form method="post" action="{% url 'update' item.id %}">
        {% csrf_token %}
        {{ form.title.label  }}
        {{ form.title }}
        {{ form.title.errors }}
        <hr>
        {{ form.description.label  }}
        {{ form.description }}
        {{ form.description.errors }}
        <hr>

        <button type="submit">
            ثبت ویرایش
        </button>
    </form>
{% endblock %}
